# Neo4j 5 + APOC + GDS. Auth comes from ../.env (NEO4J_USER / NEO4J_PASSWORD).
# Usage (from the repo root): docker compose -f neo4j/docker-compose.yml --env-file .env up -d
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: reversa-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    volumes:
      - ./data:/data
      - ./logs:/logs
    restart: unless-stopped
