<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f5f4f0; --surface: #ffffff; --surface-2: #faf9f6; --border: #e4e2dc; --border-2: #d6d3cb;
  --text: #121212; --text-2: #4f4e4a; --text-3: #85837d;
  --accent: #2547d0; --accent-soft: #e8ecfb;
  --ngo: #1f9d6b; --company: #e0632f; --assoc: #2a78d6; --union: #b47b00; --consumer: #c2508a; --other: #8a8984;
  --ins: #d5f2e3; --ins-fg: #0b5d3b; --del: #fbe1de; --del-fg: #8d2620; --hl: rgba(255, 196, 0, .38);
  --good: #1f9d6b; --bad: #c8412f; --shadow: 0 1px 2px rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a18; --surface-2: #151514; --border: #2c2b28; --border-2: #3a3935;
    --text: #f4f3ef; --text-2: #c2c0b8; --text-3: #8d8b83;
    --accent: #7d97ff; --accent-soft: #1f2645;
    --ngo: #35c48c; --company: #f08350; --assoc: #5a9cf0; --union: #dca62a; --consumer: #e47bb0; --other: #8d8b83;
    --ins: #113d29; --ins-fg: #a6ecc8; --del: #47201c; --del-fg: #f4b0a8; --hl: rgba(255, 196, 0, .28);
    --good: #35c48c; --bad: #f07a68; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a18; --surface-2: #151514; --border: #2c2b28; --border-2: #3a3935;
  --text: #f4f3ef; --text-2: #c2c0b8; --text-3: #8d8b83;
  --accent: #7d97ff; --accent-soft: #1f2645;
  --ngo: #35c48c; --company: #f08350; --assoc: #5a9cf0; --union: #dca62a; --consumer: #e47bb0; --other: #8d8b83;
  --ins: #113d29; --ins-fg: #a6ecc8; --del: #47201c; --del-fg: #f4b0a8; --hl: rgba(255, 196, 0, .28);
  --good: #35c48c; --bad: #f07a68; --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.serif { font-family: Newsreader, Georgia, serif; }
header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); }
.bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -.01em; font-size: 16px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.actchip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.main { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav.main a { color: var(--text-2); padding: 6px 11px; border-radius: 8px; font-size: 14px; }
nav.main a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); border: 1px solid var(--border); }
nav.main a:hover { text-decoration: none; color: var(--text); }
main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 80px; }
h1 { font: 600 40px/1.1 Newsreader, Georgia, serif; letter-spacing: -.015em; margin: 0 0 10px; }
h2 { font-size: 20px; margin: 0 0 12px; letter-spacing: -.01em; }
h3 { font-size: 13px; margin: 0 0 8px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.lead { font-size: 17px; color: var(--text-2); max-width: 820px; margin: 0 0 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) 340px; }
@media (max-width: 960px) { .g2, .g3, .g4, .g-side { grid-template-columns: 1fr; } h1 { font-size: 32px; } }
.mt { margin-top: 16px; } .mt2 { margin-top: 28px; }
.stat .v { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--text-2); font-size: 13px; }
.stat .s { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.muted { color: var(--text-3); }
.small { font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--border-2); color: var(--text-2); background: var(--surface-2); white-space: nowrap; }
.badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.badge.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.tdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 0 0 28px; }
.act { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.act.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.act[disabled] { cursor: not-allowed; opacity: .55; }
.act .n { font-weight: 650; } .act .p { font-size: 12.5px; color: var(--text-3); }
.rank { display: grid; grid-template-columns: 36px minmax(0, 2.4fr) 1.4fr repeat(4, 74px) 92px; gap: 10px; align-items: center;
  padding: 11px 6px; border-bottom: 1px solid var(--border); cursor: pointer; }
.rank:hover { background: var(--surface-2); }
.rank.head { cursor: default; font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.rank.head:hover { background: none; }
.rank .num { text-align: right; font-variant-numeric: tabular-nums; }
.rank .pos { color: var(--text-3); font-variant-numeric: tabular-nums; }
.barwrap { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.barwrap > div { height: 100%; border-radius: 99px; }
@media (max-width: 860px) { .rank { grid-template-columns: 28px 1fr 70px 70px; } .rank .hide-s { display: none; } }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
select, input[type=search], button { font: inherit; font-size: 14px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--border-2);
  background: var(--surface); color: var(--text); }
button { cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
.kv > div:nth-child(odd) { color: var(--text-3); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.person { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; background: var(--surface); }
.person:hover { border-color: var(--border-2); background: var(--surface-2); }
.avatar { width: 44px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex: none; display: grid; place-items: center;
  color: var(--text-3); font-weight: 600; font-size: 14px; border: 1px solid var(--border); overflow: hidden; }
.avatar.lg { width: 112px; height: 136px; border-radius: 12px; font-size: 30px; }
.timeline { position: relative; margin-left: 14px; }
.step { position: relative; padding: 0 0 26px 30px; }
.step::before { content: ""; position: absolute; left: -1px; top: 6px; bottom: -6px; width: 2px; background: var(--border-2); }
.step:last-child::before { display: none; }
.step .knob { position: absolute; left: -9px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface);
  border: 3px solid var(--accent); }
.step.off .knob { border-color: var(--border-2); }
.step .when { font-size: 12.5px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.step .title { font-weight: 650; font-size: 16px; margin: 1px 0 8px; }
.textbox { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; line-height: 1.6; }
.textbox.quote { font-family: Newsreader, Georgia, serif; font-size: 16.5px; }
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; }
ins { background: var(--ins); color: var(--ins-fg); text-decoration: none; border-radius: 3px; padding: 0 1px; }
del { background: var(--del); color: var(--del-fg); border-radius: 3px; padding: 0 1px; }
.gauge { margin: 6px 0 14px; }
.gauge .row { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 4px; }
.gauge .track { height: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; position: relative; overflow: visible; }
.gauge .fill { height: 100%; border-radius: 99px; background: var(--accent); }
.gauge .base { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-3); }
.why li { margin: 4px 0; font-size: 13.5px; }
.why .up { color: var(--good); font-weight: 700; } .why .down { color: var(--bad); font-weight: 700; }
.callout { border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--accent-soft); border-radius: 0 10px 10px 0; font-size: 14px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 30px 0 12px; }
.section-title h2 { margin: 0; }
.plot { width: 100%; }
.empty { color: var(--text-3); font-size: 14px; padding: 8px 0; }
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: end; margin-bottom: 8px; }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr; } }
.footer { color: var(--text-3); font-size: 12.5px; margin-top: 40px; border-top: 1px solid var(--border); padding-top: 14px; }
/* search */
.searchbtn { display: flex; align-items: center; gap: 8px; color: var(--text-3); background: var(--surface); min-width: 210px; font-size: 13.5px; padding: 6px 10px; }
.searchbtn:hover { border-color: var(--accent); color: var(--text-2); }
kbd { font: 600 11px/1 Inter, system-ui; padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text-3); }
.searchbtn kbd { margin-left: auto; }
.sk { position: fixed; inset: 0; z-index: 50; background: rgba(10,10,10,.38); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding: 9vh 16px 16px; }
.sk[hidden] { display: none; }
.skbox { width: min(680px, 100%); background: var(--surface); border: 1px solid var(--border-2); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.25); overflow: hidden; }
.skbox input { width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 16px 18px; font-size: 17px; outline: none; background: var(--surface); color: var(--text); }
.skr { max-height: 60vh; overflow: auto; padding: 6px; }
.skg { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 10px 12px 4px; }
.ski { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
.ski.on { background: var(--accent-soft); }
.ski .t { font-weight: 600; } .ski .s { color: var(--text-3); font-size: 12.5px; }
.ski .k { margin-left: auto; font-size: 11px; color: var(--text-3); }
.skfoot { border-top: 1px solid var(--border); padding: 8px 14px; font-size: 12px; color: var(--text-3); display: flex; gap: 14px; }
/* jump bar + pager */
.toc { position: sticky; top: var(--hh, 56px); z-index: 5; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 0 -16px 18px; padding: 8px 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.toc .lbl { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-right: 6px; }
.toc a { font-size: 13px; padding: 4px 10px; border-radius: 999px; color: var(--text-2); cursor: pointer; border: 1px solid transparent; }
.toc a:hover { text-decoration: none; background: var(--surface); border-color: var(--border); color: var(--text); }
[id^="sec-"] { scroll-margin-top: calc(var(--hh, 56px) + 60px); }
.crumbs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; font-size: 14px; }
.crumbs .sep { color: var(--text-3); }
.pager { margin-left: auto; display: flex; gap: 6px; }
.pager a { font-size: 13px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text-2); max-width: 260px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pager a:hover { text-decoration: none; border-color: var(--accent); color: var(--text); }
.pager a.off { opacity: .4; pointer-events: none; }
/* articles */
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 7px 12px; background: transparent; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--border-2); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; position: relative; overflow: hidden; }
.tile:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.tile .lb { font-weight: 650; } .tile .tt { font-size: 12.5px; color: var(--text-2); min-height: 2.6em; line-height: 1.3; margin: 2px 0 8px; }
.tile .nums { display: flex; gap: 10px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tile .nums b { color: var(--text); }
.tile .heat { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.kgroup { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.kgroup h2 { margin: 0; }
.slider { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.slider input { width: 160px; accent-color: var(--accent); }
.slider b { min-width: 2ch; font-variant-numeric: tabular-nums; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--text-2); cursor: pointer; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sym { display: inline-block; width: 10px; height: 10px; background: var(--text-3); }
.sym.c { border-radius: 50%; } .sym.d { transform: rotate(45deg) scale(.85); } .sym.r { border-radius: 50%; background: none; border: 2.5px solid var(--text); }
tr.sel td { background: var(--accent-soft) !important; }
.detail-empty { color: var(--text-3); font-size: 14px; }
.bignum { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
</style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const ACT = D.acts.find(a => a.ready);
const app = document.getElementById('app');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (x, d = 1) => x == null || isNaN(x) ? '–' : (100 * x).toFixed(d) + '%';
const num = x => x == null || isNaN(x) ? '–' : Number(x).toLocaleString('en');
const eur = x => x == null || isNaN(x) ? '–' : x === 0 ? 'none declared' : '€' + Math.round(x).toLocaleString('en');
const TYPES = {NGO: ['NGO', '--ngo'], COMPANY: ['Company', '--company'], BUSINESS_ASSOCIATION: ['Business association', '--assoc'],
  TRADE_UNION: ['Trade union', '--union'], CONSUMER_ORGANISATION: ['Consumer organisation', '--consumer']};
const tname = t => (TYPES[t] || [t || 'Other'])[0];
const tcol = t => css((TYPES[t] || [0, '--other'])[1]);
const tdot = t => `<span class="tdot" style="background:${tcol(t)}"></span>`;
const GROUPS = {PPE: 'EPP', 'S&D': 'S&D', RE: 'Renew', 'Verts/ALE': 'Greens/EFA', ID: 'ID', ECR: 'ECR', 'GUE/NGL': 'The Left', NA: 'Non-attached'};
const gname = g => GROUPS[g] || g || '–';
const FUNNEL = D.influence.funnel, BASE = FUNNEL.find(r => String(r.user_type).startsWith('ALL'));
const LOBBIES = Object.values(D.lobbies);
const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const avatar = (m, lg) => m && m.photo ? `<img class="avatar${lg ? ' lg' : ''}" src="${esc(m.photo)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;avatar${lg ? ' lg' : ''}&quot;>${esc(initials(m.name))}</div>'">`
  : `<div class="avatar${lg ? ' lg' : ''}">${esc(initials(m && m.name))}</div>`;
const PL = (extra) => Object.assign({paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: {family: 'Inter, system-ui', color: css('--text'), size: 12},
  margin: {l: 50, r: 16, t: 10, b: 40}, xaxis: {gridcolor: css('--border'), zerolinecolor: css('--border')},
  yaxis: {gridcolor: css('--border'), zerolinecolor: css('--border')}, legend: {orientation: 'h', y: -0.18}}, extra || {});
const CFG = {displayModeBar: false, responsive: true};

// ------------------------------------------------------------ text helpers
const STOP = new Set('the and for that with this from shall which such are have has not but their they into been also other where when should would could than then its any all may can more most these those whether under including within upon order being only them there what will were your about between'.split(' '));
const toks = s => (s || '').toLowerCase().match(/[a-zà-ÿ0-9]+/g) || [];
function highlight(text, other) {
  const ow = new Set(toks(other).filter(w => w.length > 3 && !STOP.has(w)));
  return esc(text).replace(/[A-Za-zÀ-ÿ0-9]+/g, w => ow.has(w.toLowerCase()) ? `<mark>${w}</mark>` : w);
}
function diff(a, b) {  // word-level LCS diff -> html with <del>/<ins>
  const A = (a || '').split(/\s+/).filter(Boolean), B = (b || '').split(/\s+/).filter(Boolean);
  if (A.length * B.length > 400000) return esc(b);
  const n = A.length, m = B.length, L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push(esc(A[i])); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { out.push(`<del>${esc(A[i])}</del>`); i++; }
    else { out.push(`<ins>${esc(B[j])}</ins>`); j++; }
  }
  while (i < n) out.push(`<del>${esc(A[i++])}</del>`);
  while (j < m) out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(' ').replace(/<\/del> <del>/g, ' ').replace(/<\/ins> <ins>/g, ' ');
}
const trunc = (s, n) => !s ? '' : s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s;

// ------------------------------------------------------------ navigation helpers
let PAGER = {};  // current page's prev/next hrefs, used by the ← / → keys
function crumbs(trail, prev, next) {
  PAGER = {prev: prev && prev[0], next: next && next[0]};
  const pg = (p, dir) => p ? `<a href="${p[0]}" title="${esc(p[1])} (${dir === 'prev' ? '←' : '→'})">${dir === 'prev' ? '← ' : ''}${esc(trunc(p[1], 34))}${dir === 'next' ? ' →' : ''}</a>`
    : `<a class="off">${dir === 'prev' ? '←' : '→'}</a>`;
  return `<div class="crumbs">${trail.map(([h, l]) => h ? `<a href="${h}">${esc(l)}</a>` : `<span class="muted">${esc(l)}</span>`).join('<span class="sep">/</span>')}
    ${prev || next ? `<div class="pager">${pg(prev, 'prev')}${pg(next, 'next')}</div>` : ''}</div>`;
}
const toc = items => `<div class="toc"><span class="lbl">On this page</span>${items.map(([id, l]) => `<a onclick="jump('${id}')">${esc(l)}</a>`).join('')}
  <a onclick="window.scrollTo({top:0,behavior:'smooth'})" style="margin-left:auto" title="Back to top">↑ top</a></div>`;
function jump(id) { const el = document.getElementById('sec-' + id); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }
const neighbours = (list, i, href, label) => [i > 0 ? [href(list[i - 1], i - 1), label(list[i - 1])] : null,
  i >= 0 && i < list.length - 1 ? [href(list[i + 1], i + 1), label(list[i + 1])] : null];
const RANKED = [...LOBBIES].sort((a, b) => b.influence - a.influence);
const MEPLIST = Object.values(D.meps).filter(m => m.tabled).sort((a, b) => (b.echoed_orgs || []).length - (a.echoed_orgs || []).length || b.tabled - a.tabled);
const ARTS = D.articles, ARTIDX = Object.fromEntries(ARTS.map((a, i) => [a.id, i]));
const artOf = unit => { const m = /^(Art\d+|Rec\d+|Annex[IVXL]+)/.exec(unit || ''); return m && m[1] in ARTIDX ? m[1] : null; };
const KIND = {article: 'Article', annex: 'Annex', recital: 'Recital'};

  const lead = (s.meps || []).find(m => m.lead) || (s.meps || [])[0];
  const why = (items) => (items || []).map(w => `<li><span class="${w.effect === 'raises' ? 'up' : 'down'}">${w.effect === 'raises' ? '▲' : '▼'}</span> ${esc(w.feature)}</li>`).join('');
  const gauge = (label, p, base, actual) => `<div class="gauge"><div class="row"><span>${label}</span><b>${pct(p, 1)}</b></div>
    <div class="track"><div class="fill" style="width:${Math.min(100, 100 * (p || 0) / Math.max(0.3, (p || 0) * 1.2))}%"></div>
    <div class="base" style="left:${Math.min(100, 100 * base / Math.max(0.3, (p || 0) * 1.2))}%" title="base rate"></div></div>
    <div class="row muted small" style="margin-top:3px"><span>base rate ${pct(base, 1)}</span><span>actual: ${actual ? '<b style="color:var(--good)">yes</b>' : '<b style="color:var(--bad)">no</b>'}</span></div></div>`;
  const sa = artOf(s.provision);
  app.innerHTML = `
  ${crumbs([['#/stories', 'Stories'], [null, `${s.org_name} → ${s.location}`]], ...neighbours(D.stories, i, (x, k) => '#/story/' + k, x => x.org_name + ' → ' + x.location))}
  <div class="controls"><select id="spick" style="max-width:100%">${D.stories.map((x, k) => `<option value="${k}" ${k === i ? 'selected' : ''}>${x.law ? '✓ ' : ''}${esc(x.org_name)} → ${esc(x.location)}</option>`).join('')}</select>
    <span class="muted small">✓ = reached the law</span></div>
  <h1>${esc(s.org_name)} → ${esc(s.location)}</h1>
  <p class="lead">How one paragraph of a ${tname(s.type).toLowerCase()}'s 2021 comment shows up in a committee amendment${s.survived ? ', the Parliament\'s report' : ''}${s.law ? ' and the final law' : ''}.
    ${sa ? `<br><a href="#/article/${sa}" class="small">See every comment similar to ${esc(ARTS[ARTIDX[sa]].label)} →</a>` : ''}</p>
  <div class="grid g-side"><div class="card"><div class="timeline">
    <div class="step"><span class="knob"></span><div class="when">${esc(s.comment_date)} · Have Your Say</div>
      <div class="title"><a href="#/lobby/${encodeURIComponent(s.org)}">${esc(s.org_name)}</a> comments on the Commission proposal</div>
      <div class="textbox quote">“${highlight(s.chunk, s.added)}”</div>
      <div class="small mt" style="margin-top:6px"><a href="${esc(s.url)}" target="_blank" rel="noopener">read the full comment ↗</a> · <mark>highlighted</mark> = words the amendment also uses</div></div>
    <div class="step"><span class="knob"></span><div class="when">${esc(s.am_date || '')} · committee ${esc(s.committee || '')}</div>
      <div class="title">Amendment ${esc(s.am)} to ${esc(s.location)}</div>
      <div class="chips" style="margin-bottom:8px">${(s.meps || []).slice(0, 8).map(m => `<a class="chip" href="#/mep/${m.id}">${m.lead ? '★ ' : ''}${esc(m.name)} · ${gname(m.group)}</a>`).join('')}${(s.meps || []).length > 8 ? `<span class="chip">+${s.meps.length - 8}</span>` : ''}</div>
      <div class="textbox">${diff(s.old_text || '', s.new_text || '')}</div>
      <div class="small mt" style="margin-top:6px"><del>struck</del> = proposal words removed · <ins>green</ins> = words the amendment inserts${s.am_src ? ` · <a href="${esc(s.am_src)}" target="_blank" rel="noopener">source PDF ↗</a>` : ''}</div></div>
    <div class="step ${s.survived ? '' : 'off'}"><span class="knob"></span><div class="when">${s.survived ? esc(s.adopted_date || '2023-06') + ' · EP plenary report' : 'EP plenary report'}</div>
      ${s.survived ? `<div class="title">Survives as report amendment ${esc(s.adopted)}</div><div class="textbox">${highlight(s.adopted_text, s.added)}</div>
        <div class="small mt" style="margin-top:6px">survival score ${(+s.survival_score).toFixed(2)} · <mark>highlighted</mark> = words of the committee amendment</div>`
        : '<div class="title">Not in the Parliament\'s report</div><div class="muted">No report amendment on this provision carries its inserted wording.</div>'}</div>
    <div class="step ${s.law ? '' : 'off'}"><span class="knob"></span><div class="when">13 June 2024 · ${esc(ACT.law)}</div>
      ${s.law ? `<div class="title">In the final law: ${esc((s.law_unit || '').replace('2024/1689:', ''))}</div><div class="textbox">${highlight(s.law_text, s.added)}</div>
        <div class="small mt" style="margin-top:6px">${pct(s.kept, 0)} of the amendment's new words are in the final text</div>`
        : `<div class="title">${s.survived ? 'Dropped in the trilogue' : 'Did not reach the law'}</div><div class="muted">${s.survived ? 'The report amendment\'s new wording is not in the final act.' : ''}</div>`}</div>
  </div></div>
  <div>
    <div class="card"><h3>How likely was this?</h3>
      ${gauge('P(survives into the EP report)', s.p_survived, D.influence.metrics.survived.base_rate, s.survived)}
      ${s.p_law != null ? gauge('P(reaches the final law)', s.p_law, D.influence.metrics.reached_law.base_rate, s.law) : ''}
      <h3 class="mt">Why</h3><ul class="why" style="padding-left:16px;margin:0">${why(s.x_law && s.x_law.length ? s.x_law : s.x_survived)}</ul>
      <p class="muted small">Model trained on all ${num(D.influence.metrics.survived.n)} committee amendments (cross-validated AUC ${D.influence.metrics.reached_law.auc_cv.toFixed(2)}). See <a href="#/influence">Pre-bill vs bill</a>.</p></div>
    <div class="card mt"><h3>The match</h3><div class="kv">
      <div>AI judge</div><div><b>${esc(s.relation)}</b> · ${esc(s.direction)} the rules</div>
      <div>Tier</div><div>${esc(s.tier)}${s.verbatim ? ' · verbatim' : ''}</div>
      <div>Longest shared run</div><div>${s.run} words</div>
      <div>Match score</div><div>${(+s.score).toFixed(1)} <span class="muted">(chance threshold ≈ ${(+(D.thresholds.s08?.B?.tau_match || 3.2)).toFixed(1)})</span></div>
      <div>Meeting recorded</div><div>${s.carrier_met ? `<span class="badge acc">yes, ${esc(s.carrier_met)}</span>` : '<span class="muted">none recorded</span>'}</div></div>
      ${s.quote ? `<div class="textbox mt small">“${esc(s.quote)}”</div>` : ''}</div>
    ${lead ? `<div class="person mt" onclick="go('#/mep/${lead.id}')">${avatar(D.meps[String(lead.id)] || lead)}<div><div class="muted small">Lead author</div><b>${esc(lead.name)}</b><div class="muted small">${gname(lead.group)}</div></div></div>` : ''}
  </div></div>`;
  spick.onchange = () => go('#/story/' + spick.value);
}

  const al = I.alignment.filter(r => r.user_type !== 'ALL'), all = I.alignment.find(r => r.user_type === 'ALL');
  const coef = I.coef.filter(c => c.outcome === 'reached_law').sort((a, b) => a.odds_ratio_per_sd - b.odds_ratio_per_sd);
  const ee = M.echo_effect, eeLaw = ee['reached_law (insertions)'];
  app.innerHTML = `<h1>Pre-bill vs bill</h1>
  <p class="lead">Two moments to influence a law: <b>before the bill</b>, when the Commission drafts it (2020 inception consultation → 2021 proposal), and
    <b>on the bill</b>, when Parliament amends it (2021 comments → 2022 committee amendments → 2023 report → 2024 law).</p>
  ${toc([['both', 'Pre-bill & bill'], ['issues', 'Pre-bill issues'], ['model', 'Reach model'], ['access', 'Access & money']])}
  <div class="grid g2" id="sec-both">
    <div class="card"><h3>Pre-bill · did the proposal take their side?</h3>
      <div class="grid g2" style="gap:10px">${stat(pct(all?.aligned_share, 0), 'of 2020 positions adopted', 'random pick would give ' + pct(all?.random_choice_baseline, 0))}
        ${stat(pct(I.echoed_a.in_law / Math.max(1, I.echoed_a.provisions), 0), 'of proposal text echoing 2020 comments survived to the law', 'vs ' + pct(I.became.in_law / Math.max(1, I.became.provisions), 0) + ' of all proposal text')}</div>
      <div id="p_align" class="plot" style="height:260px"></div>
      <p class="muted small">Positions coded by an LLM from each 2020 comment on ${I.issues.length} issues; the proposal's own choice coded from its text by three models (majority).
      Bands = range expected if positions were shuffled between organisations.</p></div>
    <div class="card"><h3>Bill · do echoed amendments go further?</h3>
      <div class="grid g2" style="gap:10px">${stat(pct(ee.survived.echoed, 1), 'of echoed amendments survived', 'vs ' + pct(ee.survived.not_echoed, 1) + ' of the rest')}
        ${stat(pct(eeLaw.echoed, 1), 'of echoed insertions reached the law', 'vs ' + pct(eeLaw.not_echoed, 1) + ' of the rest')}</div>
      <div id="p_funnel2" class="plot" style="height:260px"></div></div>
  </div>
  <div class="card mt" id="sec-issues"><h3>Pre-bill issues: what the proposal chose and who agreed</h3><table><thead><tr><th>Issue</th><th>Proposal's choice</th><th class="r">Positions</th><th class="r">Agreed</th><th>What organisations asked for</th></tr></thead><tbody>
    ${I.issues.sort((a, b) => b.positions - a.positions).map(x => `<tr><td><b>${esc(x.label)}</b></td><td>${esc((x.choice || '').replace(/_/g, ' '))}${x.agreement < 1 ? ' <span class="muted small">(2 of 3 models)</span>' : ''}</td>
      <td class="r">${x.positions}</td><td class="r">${x.aligned == null ? '–' : pct(x.aligned, 0)}</td>
      <td class="small">${Object.entries(x.stance_counts || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => esc(k.replace(/_/g, ' ')) + ' (' + v + ')').join(', ')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card mt" id="sec-model"><h3>What predicts that an amendment reaches the law?</h3>
    <div class="grid g2"><div id="p_coef" class="plot" style="height:${Math.max(380, coef.length * 19)}px"></div>
    <div><p>A logistic model trained on all ${num(M.reached_law.n)} amendments that insert wording, using only what is known when the amendment is tabled plus whether it echoes lobby text.
      Cross-validated AUC <b>${M.reached_law.auc_cv.toFixed(2)}</b> (0.5 = coin flip); base rate ${pct(M.reached_law.base_rate, 1)}.</p>
      <div class="callout"><b>Reading it:</b> bars right of 1 raise the odds of reaching the law, bars left lower them (per standard deviation of the feature, with 95% bootstrap intervals).
      Adding a new provision and amending the definitions (Art 3) help; long insertions, the ID group and ENVI amendments rarely make it.
      Echoing lobby text in itself barely moves the odds — what matters is <i>what</i> is amended and <i>by whom</i>.</div>
      <p class="muted small mt">This probability is shown for every amendment in the story and lobby pages, with the features that pushed it up or down.</p></div></div></div>
  <div class="grid g2 mt" id="sec-access">
    <div class="card"><h3>Access: did they meet the MEPs who carried their text?</h3><table><thead><tr><th>Type</th><th class="r">Echoed pairs</th><th class="r">Met</th><th class="r">Random MEPs</th></tr></thead><tbody>
      ${I.access.map(r => `<tr><td>${r.user_type === 'ALL' ? '<b>All</b>' : tdot(r.user_type) + tname(r.user_type)}</td><td class="r">${r.echoed_pairs}</td><td class="r"><b>${pct(r.carrier_met_share)}</b></td>

      ${I.money.filter(r => r.user_type === 'ALL' && r.sample === 'all matches').map(r => `<tr><td>${esc(r.metric.replace(/_/g, ' '))}</td><td class="r">${r.n}</td><td class="r">${(+r.spearman_rho).toFixed(2)}</td><td class="r">${(+r.ci_low).toFixed(2)} – ${(+r.ci_high).toFixed(2)}</td></tr>`).join('')}</tbody></table>
      <p class="muted small">Correlation between the influence score and 2026 register figures. Every interval includes 0: no measurable link.</p></div>
  </div>`;
  Plotly.newPlot('p_align', [
    {type: 'bar', x: al.map(r => tname(r.user_type)), y: al.map(r => r.aligned_share), marker: {color: al.map(r => tcol(r.user_type))}, text: al.map(r => pct(r.aligned_share, 0)), textposition: 'outside', cliponaxis: false,
      error_y: {type: 'data', symmetric: false, array: al.map(r => r.permutation_ci_high == null ? 0 : Math.max(0, r.permutation_ci_high - r.aligned_share)),
        arrayminus: al.map(r => r.permutation_ci_low == null ? 0 : Math.max(0, r.aligned_share - r.permutation_ci_low)), color: css('--text-3'), thickness: 1.2}},
  ], PL({showlegend: false, yaxis: {tickformat: '.0%', gridcolor: css('--border'), range: [0, 0.75]}, margin: {l: 45, r: 10, t: 20, b: 60}}), CFG);
  funnelPlot('p_funnel2');
  Plotly.newPlot('p_coef', [{type: 'scatter', mode: 'markers', y: coef.map(c => c.label), x: coef.map(c => c.odds_ratio_per_sd),
    error_x: {type: 'data', symmetric: false, array: coef.map(c => c.ci_high - c.odds_ratio_per_sd), arrayminus: coef.map(c => c.odds_ratio_per_sd - c.ci_low), color: css('--text-3'), thickness: 1.2},
    marker: {size: 9, color: coef.map(c => c.odds_ratio_per_sd >= 1 ? css('--good') : css('--bad'))}}],
    PL({showlegend: false, margin: {l: 310, r: 16, t: 10, b: 40}, xaxis: {type: 'log', title: 'odds ratio (log scale)', gridcolor: css('--border')},
      shapes: [{type: 'line', x0: 1, x1: 1, yref: 'paper', y0: 0, y1: 1, line: {dash: 'dot', color: css('--text-3')}}]}), CFG);
}

// ------------------------------------------------------------ method
function methodPage() {
  const t = D.thresholds, I = D.influence;
  app.innerHTML = `<h1>Method</h1><p class="lead">Everything on these pages is computed by the pipeline in this repository and stored in a Neo4j graph.</p>
  <div class="grid g2">
    <div class="card"><h3>Sources</h3><div class="kv">
      <div>Comments</div><div>Have Your Say: ${num(D.counts.nodes.Comment)} contributions (2020 inception impact assessment, 2021 proposal)</div>
      <div>Legal texts</div><div>EUR-Lex via CELLAR: proposal COM(2021)206 and ${esc(ACT.law)} (as adopted + 2026 consolidation)</div>
      <div>Amendments</div><div>ParlTrack: ${num(D.counts.nodes.Amendment)} committee amendments, ${num(D.counts.nodes.AdoptedAmendment)} report amendments, MEP records</div>
      <div>Lobby register</div><div>LobbyFacts and Integrity Watch EU (2026 snapshot)</div>
      <div>Meetings</div><div>Integrity Watch MEP meetings (2020 and Jun–Oct 2024 only)</div></div></div>
    <div class="card"><h3>Steps</h3><ol class="small" style="margin:0;padding-left:18px;line-height:1.7">
      <li>Comments cut into ~130-word paragraphs; legal texts parsed into articles, paragraphs and points.</li>
      <li>Each paragraph compared with proposal provisions (pre-bill) and with the words each amendment inserts (bill): embeddings (${esc(D.models.embed)}), TF-IDF and shared phrases, with proposal quotes and widely shared quotes masked.</li>
      <li>Threshold = 99th percentile of the same comparisons against an unrelated act (the DSA): ${(+(t.s08?.A?.tau_match || 0)).toFixed(2)} (pre-bill), ${(+(t.s08?.B?.tau_match || 0)).toFixed(2)} (bill).</li>
      <li>An AI judge (${esc(D.models.judge)}) rates each match: implements, partial, contradicts or unrelated. Tiers: T1 verbatim + implements, T2 verbatim or implements/partial.</li>
      <li>Amendments followed to the EP report (survival) and the final law (inserted words kept), with null-calibrated thresholds.</li>
      <li>Reach model: logistic regression for P(survive) and P(reach the law) with cross-validation and bootstrap intervals.</li></ol></div>
  </div>
  <div class="card mt"><h3>Caveats</h3><ul class="small" style="margin:0;padding-left:18px;line-height:1.7">
    <li>Similar wording is not proof of influence: shared outside sources (the HLEG guidelines, the OECD definition, the White Paper) and coalition texts produce echoes too.</li>
    <li>Register figures (spend, staff, passes, meetings) are today's, not 2021's. Unmatched organisations have no spend, never zero.</li>
    <li>Meeting records cover 2020 and June–October 2024 only; nothing covers the 2022–2023 amendment period.</li>
    <li>Only ${num(Object.values(D.lobbies).filter(o => o.match_method !== 'none').length)} of ${num(LOBBIES.length)} organisations could be matched to the register automatically.</li>
    <li>The AI judge saw ${num((D.thresholds.s08?.B?.echoes) ? 2000 : 0)} of the bill-stage matches (the strongest); the rest stay at tier T3.</li></ul></div>
  <p class="footer">Built from the hackathonReversa pipeline · ${esc(ACT.id)}</p>`;
}
function notFound() { app.innerHTML = '<h1>Not found</h1><p><a href="#/">Back to the overview</a></p>'; }

const artTile = a => `<div class="tile" onclick="go('#/article/${a.id}')" title="${esc(a.label)}">

function artGraph() {

        line: {color: g.map(([r]) => isEcho(r) ? css('--text') : css('--surface')), width: g.map(([r]) => isEcho(r) ? 2.6 : 1.2)}}});
  });
  traces.push({type: 'scatter', mode: 'markers+text', x: [0], y: [0], customdata: [-1], text: [shortLabel(ACUR)], textposition: 'middle center',
    textfont: {color: '#fff', size: 11}, marker: {size: 46, color: css('--accent'), line: {color: css('--accent-soft'), width: 6}},
    hovertext: [`<b>${esc(ACUR.label)}</b>${ACUR.title ? '<br>' + esc(ACUR.title) : ''}`], hovertemplate: '%{hovertext}<extra></extra>'});
  if (ASEL != null && items[ASEL]) traces.push({type: 'scatter', mode: 'markers', hoverinfo: 'skip', x: [items[ASEL].x], y: [items[ASEL].y],
    marker: {size: 38, symbol: 'circle-open', color: css('--accent'), line: {width: 3}}});

    shapes: rings.map(s => { const d = rad(s); return {type: 'circle', x0: -d, x1: d, y0: -d, y1: d, line: {color: css('--border'), width: 1, dash: 'dot'}, layer: 'below'}; }),

    srows.innerHTML = rows.map(([s, k]) => `<tr class="click" onclick="go('#/story/${k}')"><td>${tdot(s.type)}<b>${esc(s.org_name)}</b><div class="muted small">${tname(s.type)}</div></td>
      <td>${esc(s.location)}<div class="muted small">${esc(s.am)} · ${esc(s.committee || '')}</div></td>
      <td class="small">${esc(s.relation || '')}<div class="muted">${esc(s.tier || '')}${s.verbatim ? ' · verbatim' : ''}</div></td>
      <td>${s.law ? '<span class="badge good">in law</span>' : s.survived ? '<span class="badge">EP report only</span>' : '<span class="badge bad">dropped</span>'}</td>
      <td class="r">${pct(s.p_law, 1)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nothing matches.</td></tr>';
  };
  sq.oninput = () => { SQ = sq.value; draw(); };
  stype.onchange = () => { STYPE = stype.value; draw(); };
  sout.querySelectorAll('button').forEach(b => b.onclick = () => { SOUT = b.dataset.k; sout.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  draw();
}

// ------------------------------------------------------------ global search (/ or Cmd/Ctrl+K)
let IDX = null, SKRES = [], SKSEL = 0;
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function buildIndex() {
  const pages = [['Overview', '#/', 'Headline numbers and the featured story'], ['Lobbies', '#/lobbies', 'Ranking of organisations'], ['Articles', '#/articles', 'Similar comments per article'],
    ['Stories', '#/stories', 'Comment → amendment → law'], ['Politicians', '#/meps', 'MEPs who tabled amendments'], ['Pre-bill vs bill', '#/influence', 'When lobbying worked; reach model'],
    ['Method', '#/method', 'Sources, thresholds, caveats']];
  IDX = [
    ...pages.map(([t, h, s]) => ({k: 'Page', t, s, h, q: norm(t + ' ' + s), w: 3})),
    ...LOBBIES.map(o => ({k: 'Lobby', t: o.name, s: [tname(o.type), o.country, o.n_echoed ? o.n_echoed + ' echoed' : '', o.n_law ? o.n_law + ' in law' : ''].filter(Boolean).join(' · '),
      h: '#/lobby/' + encodeURIComponent(o.org_id), q: norm([o.name, o.register_name, tname(o.type), o.country].join(' ')), w: Math.log1p(o.influence || 0), type: o.type})),
    ...Object.values(D.meps).map(m => ({k: 'Politician', t: m.name, s: [gname(m.group), m.party, m.country, m.tabled ? m.tabled + ' amendments' : ''].filter(Boolean).join(' · '),
      h: '#/mep/' + m.id, q: norm([m.name, m.party, m.country, gname(m.group), m.group].join(' ')), w: Math.log1p(m.tabled || 0)})),
    ...ARTS.map(a => ({k: KIND[a.kind], t: a.label + (a.title ? ' · ' + a.title : ''), s: `${a.n_am} amendments · ${a.n_law} in law · ${a.n_echo} echoes`,
      h: '#/article/' + a.id, q: norm([a.label, a.title, a.id].join(' ')), l: norm(a.label), w: Math.log1p(a.n_am)})),
    ...D.stories.map((s, k) => ({k: 'Story', t: s.org_name + ' → ' + s.location, s: (s.law ? 'reached the law' : s.survived ? 'EP report only' : 'dropped') + ' · ' + s.am,
      h: '#/story/' + k, q: norm([s.org_name, s.location, s.am].join(' ')), w: s.law ? 1 : 0, type: s.type})),
  ];
}
function searchRun(raw) {
  if (!IDX) buildIndex();
  const q = norm(raw.trim()).replace(/\bart(icle)?\.?\s*(\d+)/g, 'article $2').replace(/\brec(ital)?\.?\s*(\d+)/g, 'recital $2');
  if (!q) return [...IDX.filter(x => x.k === 'Page'), ...IDX.filter(x => x.k === 'Lobby').sort((a, b) => b.w - a.w).slice(0, 5), IDX.find(x => x.h === '#/story/' + D.featured)].filter(Boolean);
  const tk = q.split(/\s+/);
  return IDX.map(x => {
    if (!tk.every(t => x.q.includes(t))) return null;
    const tl = norm(x.t); let s = x.w;
    if (x.l === q || tl === q) s += 1e6; else if (tl.startsWith(q)) s += 1e5; else if (tk.every(t => new RegExp('(^|\\W)' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(x.q))) s += 1e4;
    return [s, x];
  }).filter(Boolean).sort((a, b) => b[0] - a[0]).slice(0, 60).map(r => r[1]);
}
const SKORDER = ['Page', 'Lobby', 'Politician', 'Article', 'Annex', 'Recital', 'Story'];
function searchDraw() {
  const q = document.getElementById('skq').value, res = searchRun(q);
  const groups = SKORDER.map(k => [k, res.filter(x => x.k === k).slice(0, k === 'Story' ? 6 : 8)]).filter(([, g]) => g.length);
  SKRES = groups.flatMap(([, g]) => g); SKSEL = Math.min(SKSEL, Math.max(0, SKRES.length - 1));
  let n = 0;
  document.getElementById('skr').innerHTML = groups.map(([k, g]) => `<div class="skg">${k === 'Page' ? 'Pages' : k === 'Story' ? 'Stories' : k + 's'}</div>${g.map(x => { const i = n++;
    return `<div class="ski${i === SKSEL ? ' on' : ''}" data-i="${i}" onmousemove="skHover(${i})" onclick="skOpen(${i})">
      ${x.type ? tdot(x.type) : '<span class="tdot" style="background:var(--border-2)"></span>'}<div style="min-width:0"><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div></div><span class="k">${esc(x.k)}</span></div>`; }).join('')}`).join('')
    || `<div class="empty" style="padding:14px">No match for “${esc(q)}”.</div>`;
}
function skHover(i) { if (i === SKSEL) return; SKSEL = i; document.querySelectorAll('#skr .ski').forEach(e => e.classList.toggle('on', +e.dataset.i === i)); }
function skOpen(i) { const x = SKRES[i]; if (!x) return; closeSearch(); if (location.hash === x.h) route(); else go(x.h); }
function openSearch() { const s = document.getElementById('sk'), q = document.getElementById('skq'); s.hidden = false; q.value = ''; SKSEL = 0; searchDraw(); setTimeout(() => q.focus(), 0); }
function closeSearch() { document.getElementById('sk').hidden = true; }
document.getElementById('skq').addEventListener('input', () => { SKSEL = 0; searchDraw(); });
document.getElementById('skq').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SKSEL = Math.max(0, Math.min(SKRES.length - 1, SKSEL + (e.key === 'ArrowDown' ? 1 : -1)));
    document.querySelectorAll('#skr .ski').forEach(el => el.classList.toggle('on', +el.dataset.i === SKSEL));
    document.querySelector(`#skr .ski[data-i="${SKSEL}"]`)?.scrollIntoView({block: 'nearest'}); }
  else if (e.key === 'Enter') { e.preventDefault(); skOpen(SKSEL); }
  else if (e.key === 'Escape') closeSearch();
});
document.addEventListener('keydown', e => {
  const t = e.target, typing = /^(input|textarea|select)$/i.test(t.tagName || '') || t.isContentEditable, open = !document.getElementById('sk').hidden;
  if ((e.key.toLowerCase() === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) { e.preventDefault(); open ? closeSearch() : openSearch(); return; }
  if (e.key === 'Escape' && open) { closeSearch(); return; }
  if (typing || open || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  if (e.key === 'ArrowLeft' && PAGER.prev) go(PAGER.prev);
  else if (e.key === 'ArrowRight' && PAGER.next) go(PAGER.next);
});

// ------------------------------------------------------------ router
function go(h) { location.hash = h; }
function route() {
  PAGER = {};
  const [, page = '', arg = ''] = decodeURIComponent(location.hash || '#/').split('/');
  const navKey = {lobby: 'lobbies', mep: 'meps', story: 'stories', article: 'articles'}[page] ?? page;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === navKey));
  ({'': overview, lobbies: lobbiesPage, lobby: () => lobbyPage(arg), story: () => storyPage(arg), stories: storiesPage, meps: mepsPage, mep: () => mepPage(arg),
    articles: articlesPage, article: () => articlePage(arg), influence: influencePage, method: methodPage}[page] || notFound)();
  window.scrollTo(0, 0);
}
const setHH = () => document.documentElement.style.setProperty('--hh', document.querySelector('header.top').offsetHeight + 'px');
window.addEventListener('resize', setHH); setHH();
window.addEventListener('hashchange', route);
route();
</script>
